<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="EduTarefas — organização de tarefas escolares e prazos acadêmicos" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <title>EduTarefas</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">ET</div>
          <div>
            <h1>EduTarefas</h1>
            <p>Seu planejamento escolar</p>
          </div>
        </div>
        <button id="instalar" class="btn ghost" hidden>Instalar app</button>
      </header>
      <main class="container">
        <section class="stats" aria-label="Resumo geral">
          <article class="stat-card"><span id="totalTarefas">0</span><small>Total</small></article>
          <article class="stat-card"><span id="pendentes">0</span><small>Pendentes</small></article>
          <article class="stat-card"><span id="concluidas">0</span><small>Concluídas</small></article>
          <article class="stat-card warning"><span id="atrasadas">0</span><small>Atrasadas</small></article>
        </section>
        <section class="panel">
          <div class="panel-header"><h2>Nova tarefa</h2></div>
          <form id="formTarefa" class="task-form">
            <div class="field-group"><label for="titulo">Título da tarefa</label><input id="titulo" name="titulo" type="text" maxlength="160" placeholder="Ex.: Entregar trabalho de matemática" required /></div>
            <div class="two-columns">
              <div class="field-group"><label for="disciplina">Disciplina</label><select id="disciplina"><option value="Geral">Geral</option><option value="Matemática">Matemática</option><option value="Português">Português</option><option value="História">História</option><option value="Geografia">Geografia</option><option value="Ciências">Ciências</option><option value="Inglês">Inglês</option><option value="Arte">Arte</option><option value="Educação Física">Educação Física</option></select></div>
              <div class="field-group"><label for="prioridade">Prioridade</label><select id="prioridade"><option value="Baixa">Baixa</option><option value="Média" selected>Média</option><option value="Alta">Alta</option><option value="Urgente">Urgente</option></select></div>
            </div>
            <div class="two-columns">
              <div class="field-group"><label for="prazo">Prazo</label><input id="prazo" type="date" required /></div>
              <div class="field-group"><label for="observacoes">Observações</label><input id="observacoes" type="text" maxlength="200" placeholder="Opcional" /></div>
            </div>
            <button type="submit" class="btn primary">Adicionar tarefa</button><p id="mensagem" class="message" aria-live="polite"></p>
          </form>
        </section>
        <section class="panel list-panel">
          <div class="panel-header list-header"><h2>Minhas tarefas</h2><div class="list-actions"><button id="exportar" class="btn small ghost" type="button">Exportar</button><label class="btn small ghost import-btn">Importar<input id="importarArquivo" type="file" accept=".json" hidden /></label></div></div>
          <div class="toolbar"><input id="busca" type="search" placeholder="Buscar por tarefa ou disciplina..." aria-label="Buscar tarefas" /><div class="filtros" aria-label="Filtros de tarefas"><button class="filtro active" data-filtro="todas" type="button">Todas</button><button class="filtro" data-filtro="pendentes" type="button">Pendentes</button><button class="filtro" data-filtro="concluidas" type="button">Concluídas</button><button class="filtro" data-filtro="atrasadas" type="button">Atrasadas</button></div></div>
          <ul id="listaTarefas" class="task-list"></ul><p id="vazio" class="empty-state" hidden>Nenhuma tarefa encontrada.</p>
        </section>
      </main>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
